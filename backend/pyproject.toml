[project]
name = "ai-chatbot-backend"
version = "0.1.0"
description = "Production-ready backend for a full-stack AI chatbot application (FastAPI + LangGraph)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "langgraph>=0.2.0",
    "pyjwt>=2.9.0",
    "google-auth>=2.35.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.4",
    "langchain-core>=1.5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
