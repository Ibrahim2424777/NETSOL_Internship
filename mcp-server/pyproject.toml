[project]
name = "mcp-server"
version = "0.1.0"
description = "Standalone MCP server exposing tools (weather, later email) for the AI chatbot to consume as an MCP client (Phase 17+)."
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "google-auth>=2.56.3",
    "google-auth-oauthlib>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits the real Open-Meteo API over the network (deselect with -m \"not live\")",
]
