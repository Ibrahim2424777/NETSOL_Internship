<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030303" />
    <!-- Inter (body/UI) + Fraunces (display serif, headings only - Phase
         15.1) - both via Google Fonts CDN rather than an npm package
         (fontsource etc.), avoiding a new dependency for two font families,
         per Phase 12.5's "avoid unnecessary dependencies". Fraunces is used
         sparingly (large headings only, via .font-display in index.css) -
         still just two font families total, not a font-per-section grab bag. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <title>AI Chatbot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
